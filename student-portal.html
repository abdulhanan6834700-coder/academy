<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial,sans-serif;background:#071f3d;color:#fff;margin:0}.wrap{max-width:1000px;margin:auto;padding:30px}.card{background:#0d2d59;border:1px solid #d4af37;border-radius:16px;padding:24px;margin:18px 0}input,button{padding:13px;border-radius:8px;border:0;margin:6px 0;width:100%;box-sizing:border-box}button{background:#d4af37;color:#071f3d;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.stat{background:#123a70;padding:18px;border-radius:12px}.muted{color:#c9d6e8}.danger{background:#b91c1c;color:white}.hidden{display:none}h1,h2{color:#ffd700}</style></head>
<body><div class="wrap"><a href="index.html" style="color:#ffd700">← Main Website</a><h1>🎓 Student Portal</h1>
<div id="login" class="card"><h2>Student Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></div>
<div id="dashboard" class="hidden"><div class="card"><button class="danger" onclick="logout()">Logout</button><h2 id="welcome">Welcome</h2><div class="grid"><div class="stat"><b>Student ID</b><div id="studentCode">-</div></div><div class="stat"><b>Course</b><div id="course">-</div></div><div class="stat"><b>Attendance</b><div id="attendance">-</div></div><div class="stat"><b>Fee Status</b><div id="fee">-</div></div></div></div>
<div class="card"><h2>My Classes</h2><p><b>Teacher:</b> <span id="teacher">-</span></p><p><b>Schedule:</b> <span id="schedule">-</span></p><p><b>Progress:</b></p><div id="progress" class="muted">-</div></div>
<div class="card"><h2>My Admission</h2><div id="admission">Loading...</div></div></div></div>
<script>
const SUPABASE_URL="https://vxquqxiblysgzrpgfvgc.supabase.co", SUPABASE_ANON_KEY="sb_publishable_6ItmZHYYCjj0dn7nz7-uLQ_wzXwUJrO";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const r=await sb.auth.signInWithPassword({email,password});if(r.error){document.getElementById('msg').textContent=r.error.message;return}load()}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user)return;document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');
const p=await sb.from('profiles').select('*').eq('id',user.id).single();const r=await sb.from('student_records').select('*').eq('student_id',user.id).single();const a=await sb.from('admissions').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
document.getElementById('welcome').textContent='Welcome, '+(p.data?.full_name||user.email);document.getElementById('studentCode').textContent=p.data?.student_code||a.data?.student_code||'Not assigned';document.getElementById('course').textContent=r.data?.course||a.data?.course||'Not assigned';document.getElementById('attendance').textContent=(r.data?.attendance_percent??0)+'%';document.getElementById('fee').textContent=r.data?.fee_status||'Pending';document.getElementById('teacher').textContent=r.data?.teacher||'Not assigned';document.getElementById('schedule').textContent=r.data?.class_schedule||'Not assigned';document.getElementById('progress').textContent=r.data?.progress||'No progress update yet.';document.getElementById('admission').innerHTML=a.data?`<p><b>Status:</b> ${a.data.status}</p><p><b>Course:</b> ${a.data.course}</p><p><b>Submitted:</b> ${new Date(a.data.created_at).toLocaleString()}</p>`:'No admission record found.'}
async function logout(){await sb.auth.signOut();location.reload()}load();
</script></body></html>
