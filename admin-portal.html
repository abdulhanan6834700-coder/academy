<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#071f3d;color:#fff;margin:0}.wrap{max-width:1200px;margin:auto;padding:25px}.card{background:#0d2d59;border:1px solid #d4af37;border-radius:15px;padding:20px;margin:15px 0}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border-radius:7px;border:0}button{background:#d4af37;font-weight:bold;cursor:pointer}.danger{background:#b91c1c;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}table{width:100%;border-collapse:collapse;background:#123a70}th,td{padding:9px;border:1px solid #49688f;text-align:left}th{color:#ffd700}.tablewrap{overflow:auto}.hidden{display:none}h1,h2{color:#ffd700}.small{font-size:12px;color:#c9d6e8}</style></head><body><div class="wrap"><a href="index.html" style="color:#ffd700">← Main Website</a><h1>🔐 Admin Portal</h1>
<div id="login" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></div>
<div id="app" class="hidden"><button class="danger" onclick="logout()">Logout</button><div class="grid"><div class="card"><h2 id="total">0</h2><div>Total Applications</div></div><div class="card"><h2 id="pending">0</h2><div>Pending</div></div><div class="card"><h2 id="students">0</h2><div>Student Accounts</div></div></div>
<div class="card"><h2>Admissions</h2><input id="search" placeholder="Search student, parent, country or course" oninput="renderAdmissions()"><div class="tablewrap"><table><thead><tr><th>Student ID</th><th>Student</th><th>Parent</th><th>Course</th><th>Status</th><th>Action</th></tr></thead><tbody id="admissions"></tbody></table></div></div>
<div class="card"><h2>Update Student Record</h2><select id="studentSelect"></select><div class="grid"><input id="course" placeholder="Course"><input id="teacher" placeholder="Teacher"><input id="schedule" placeholder="Class schedule"><input id="attendance" type="number" min="0" max="100" placeholder="Attendance %"><input id="fee" placeholder="Fee status"><textarea id="progress" placeholder="Progress / report"></textarea><textarea id="notes" placeholder="Admin notes"></textarea></div><button onclick="saveRecord()">Save Student Record</button><p id="saveMsg"></p></div></div></div>
<script>
const SUPABASE_URL="https://vxquqxiblysgzrpgfvgc.supabase.co",SUPABASE_ANON_KEY="sb_publishable_6ItmZHYYCjj0dn7nz7-uLQ_wzXwUJrO";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let admissions=[],profiles=[];
async function login(){const emailValue=document.getElementById('email').value.trim();const passwordValue=document.getElementById('password').value;if(!emailValue||!passwordValue){msg.textContent='Please enter email and password.';return}const r=await sb.auth.signInWithPassword({email:emailValue,password:passwordValue});if(r.error){msg.textContent=r.error.message;return}const p=await sb.from('profiles').select('role').eq('id',r.data.user.id).single();if(p.data?.role!=='admin'){await sb.auth.signOut();msg.textContent='This account is not an admin.';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');load()}
async function load(){const a=await sb.from('admissions').select('*').order('created_at',{ascending:false});if(a.error){alert(a.error.message);return}admissions=a.data||[];const p=await sb.from('profiles').select('*').eq('role','student').order('created_at',{ascending:false});profiles=p.data||[];total.textContent=admissions.length;pending.textContent=admissions.filter(x=>x.status==='pending').length;students.textContent=profiles.length;renderAdmissions();studentSelect.innerHTML='<option value="">Select student</option>'+profiles.map(x=>`<option value="${x.id}">${x.full_name||'Student'} — ${x.student_code||x.id.slice(0,8)}</option>`).join('')}
function renderAdmissions(){const q=(document.getElementById('search').value||'').toLowerCase();admissionsEl=document.getElementById('admissions');const rows=admissions.filter(x=>JSON.stringify(x).toLowerCase().includes(q));admissionsEl.innerHTML=rows.map(x=>`<tr><td>${x.student_code}</td><td>${x.student_name}<br><span class="small">${x.country}</span></td><td>${x.parent_name}<br>${x.parent_phone}</td><td>${x.course}</td><td><select onchange="statusChange('${x.id}',this.value)"><option ${x.status==='pending'?'selected':''}>pending</option><option ${x.status==='approved'?'selected':''}>approved</option><option ${x.status==='rejected'?'selected':''}>rejected</option></select></td><td>${x.user_id?'Portal linked':'No portal link'}</td></tr>`).join('')}
async function statusChange(id,status){const r=await sb.from('admissions').update({status}).eq('id',id);if(r.error)alert(r.error.message);else load()}
async function saveRecord(){const id=studentSelect.value;if(!id){saveMsg.textContent='Select a student first.';return}const payload={student_id:id,course:course.value,teacher:teacher.value,class_schedule:schedule.value,attendance_percent:Number(attendance.value||0),fee_status:fee.value||'Pending',progress:progress.value,notes:notes.value,updated_at:new Date().toISOString()};const r=await sb.from('student_records').upsert(payload,{onConflict:'student_id'});saveMsg.textContent=r.error?r.error.message:'Saved successfully.'}
studentSelect.addEventListener('change',async()=>{const id=studentSelect.value;if(!id)return;const r=await sb.from('student_records').select('*').eq('student_id',id).maybeSingle();const x=r.data||{};course.value=x.course||'';teacher.value=x.teacher||'';schedule.value=x.class_schedule||'';attendance.value=x.attendance_percent??0;fee.value=x.fee_status||'Pending';progress.value=x.progress||'';notes.value=x.notes||''});async function logout(){await sb.auth.signOut();location.reload()}
</script></body></html>
